<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Админ — Павел Стамболийски</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#0b0b0b;--fg:#f3efe8;--muted:#a39d92;--line:#2a2824;--accent:#c9a45c;--btnfg:#0b0b0b;color-scheme:dark}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f6f2ea;--fg:#16140f;--muted:#6b655a;--line:#ddd6c7;--accent:#8a6a2a;--btnfg:#fff;color-scheme:light}}
:root[data-theme="dark"]{--bg:#0b0b0b;--fg:#f3efe8;--muted:#a39d92;--line:#2a2824;--accent:#c9a45c;--btnfg:#0b0b0b}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font-family:Georgia,"Times New Roman",serif;line-height:1.6}
a{color:inherit}
.wrap{max-width:720px;margin:0 auto;padding:0 24px}
header{display:flex;justify-content:space-between;align-items:center;padding:20px 0;font:600 13px/1 system-ui,sans-serif;letter-spacing:.18em;text-transform:uppercase}
.btn{display:inline-block;padding:14px 26px;background:var(--accent);color:var(--btnfg);text-decoration:none;font:600 13px/1 system-ui,sans-serif;letter-spacing:.14em;text-transform:uppercase;border-radius:2px}
.btn.ghost{background:none;color:var(--fg);border:1px solid var(--line)}
.hero{padding:96px 0 80px;text-align:center}
.hero h1{margin:0;font-size:clamp(34px,10vw,68px);font-weight:400;letter-spacing:.02em;line-height:1}
.hero p{margin:12px 0 36px;color:var(--accent);font:600 13px/1 system-ui,sans-serif;letter-spacing:.4em;text-transform:uppercase}
.row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
section{padding:48px 0;border-top:1px solid var(--line)}
h2{margin:0 0 20px;font:600 13px/1 system-ui,sans-serif;letter-spacing:.25em;text-transform:uppercase;color:var(--accent)}
ul{list-style:none;margin:0;padding:0}
li{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line)}
li span:last-child{color:var(--muted)}
.closed{color:var(--muted)}
footer{padding:40px 0;text-align:center;color:var(--muted);font:13px system-ui,sans-serif}
.book{display:grid;gap:14px}
.days,.slots{display:flex;gap:8px;flex-wrap:wrap}
.chip{padding:10px 14px;border:1px solid var(--line);background:none;color:var(--fg);font:600 13px system-ui,sans-serif;cursor:pointer;border-radius:2px}
.chip.on{background:var(--accent);color:var(--btnfg);border-color:var(--accent)}
.chip:disabled{opacity:.3;text-decoration:line-through;cursor:not-allowed}
input{width:100%;padding:13px;background:none;color:var(--fg);border:1px solid var(--line);font:16px system-ui,sans-serif;border-radius:2px}
#msg{font:14px system-ui,sans-serif;color:var(--accent);min-height:20px}
.own{font:14px system-ui,sans-serif}.own div{padding:8px 0;border-bottom:1px solid var(--line)}
.btn{border:0;cursor:pointer}
.login{max-width:380px;margin:0 auto;padding:60px 0;display:grid;gap:14px;text-align:center}
.login h1{margin:0 0 10px;font-weight:400;font-size:34px}
[hidden]{display:none!important}
.card{border:1px solid var(--line);border-left:4px solid var(--muted);border-radius:4px;padding:16px 18px;margin:0 0 12px;display:grid;gap:10px}
.card.confirmed{border-left-color:#5fae6b;background:rgba(95,174,107,.08)}
.card.pending{border-left-color:var(--accent);background:rgba(201,164,92,.08)}
.card.canceled{opacity:.5}
.card .t{font:600 26px/1 Georgia,serif}
.card .who{font:16px system-ui,sans-serif}
.badge{font:600 11px system-ui,sans-serif;letter-spacing:.14em;text-transform:uppercase;padding:4px 8px;border:1px solid currentColor;border-radius:2px;justify-self:start}
.card.confirmed .badge{color:#5fae6b}.card.pending .badge{color:var(--accent)}.card.canceled .badge{color:var(--muted)}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.today{color:var(--accent)}
</style>
</head>
<body>
<div class="wrap">
<header><span>Павел Стамболийски</span><span><a class="btn ghost" href="index.html">Към сайта</a> <button class="btn" id="out" type="button" hidden>Изход</button></span></header>
<div id="gate" class="own">Проверка…</div>
<form class="login" id="f" hidden>
<h1>Вход</h1>
<input id="email" type="email" placeholder="Имейл" autocomplete="username" required>
<input id="pw" type="password" placeholder="Парола" autocomplete="current-password" required>
<button class="btn" id="go" type="submit">Влез</button>
<div id="lmsg"></div>
</form>
<section style="border:0" id="panel" hidden>
<h2>Админ панел</h2>
<div id="astat" class="own"></div>
<div id="alist"></div>
</section>
</div>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,onAuthStateChanged,signInWithEmailAndPassword,signOut} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {getFirestore,collection,doc,writeBatch,onSnapshot} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const firebaseConfig={
  apiKey:"AIzaSyCtprYxyUHH3mh3rU2hXxdl4E5y-3sccLk",
  authDomain:"tapmymenu-c411b.firebaseapp.com",
  projectId:"tapmymenu-c411b",
  storageBucket:"tapmymenu-c411b.firebasestorage.app",
  messagingSenderId:"87565740314",
  appId:"1:87565740314:web:34a91e0b64af026e90a4a3"
};
const ADMIN_EMAIL="dim.yazovaliyskii@gmail.com"; // same email as in the Firestore rules
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);
const $=i=>document.getElementById(i),pad=n=>String(n).padStart(2,"0");
const ymd=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const show=(login,panel,out,gate)=>{$("f").hidden=!login;$("panel").hidden=!panel;$("out").hidden=!out;$("gate").textContent=gate||"";$("gate").hidden=!gate};
let bookings={},unsub=null;
const slotOf=(id,v)=>v.slot||id.slice(0,15);
const bref=id=>doc(db,"barber_bookings",id),sref=s=>doc(db,"barber_slots",s);
async function setStatus(id,v,st){const b=writeBatch(db);b.update(bref(id),{status:st});if(st==="canceled")b.delete(sref(slotOf(id,v)));await b.commit()}
async function remove(id,v){const b=writeBatch(db);b.delete(bref(id));b.delete(sref(slotOf(id,v)));await b.commit()}
function btn(label,fn,primary){const x=document.createElement("button");x.type="button";x.className=primary?"btn":"chip";x.style.padding="10px 14px";x.textContent=label;x.onclick=()=>fn().catch(e=>{console.error(e);alert("Грешка ("+(e&&e.code||"unknown")+"). Опитай отново.")});return x}
function render(){
const ls=$("alist");ls.innerHTML="";const today=ymd(new Date());
const items=Object.keys(bookings).map(id=>({id,v:bookings[id],slot:slotOf(id,bookings[id]),st:bookings[id].status||"pending"})).sort((x,y)=>x.slot<y.slot?-1:1);
const act=items.filter(x=>x.st!=="canceled"&&x.slot.slice(0,10)>=today);
$("astat").textContent="Предстоящи: "+act.length+" · Потвърдени: "+act.filter(x=>x.st==="confirmed").length+" · Общо: "+items.length;
if(!items.length){ls.textContent="Все още няма резервации.";return}
const L={pending:"Чака потвърждение",confirmed:"Потвърдена",canceled:"Отказана"};
let last="";
items.forEach(({id,v,slot,st})=>{const dd=slot.slice(0,10);
if(dd!==last){last=dd;const h=document.createElement("h2");h.style.marginTop="28px";if(dd===today)h.className="today";h.textContent=dd+(dd===today?" · днес":"");ls.appendChild(h)}
const c=document.createElement("div");c.className="card "+st;
const t=document.createElement("div");t.className="t";t.textContent=slot.slice(11,13)+":"+slot.slice(13);
const w=document.createElement("div");w.className="who";w.textContent=v.name+" · ";
const a=document.createElement("a");a.href="tel:"+encodeURIComponent(v.phone);a.textContent=v.phone;w.appendChild(a);
const bd=document.createElement("div");bd.className="badge";bd.textContent=L[st]||st;
const ac=document.createElement("div");ac.className="acts";
if(st!=="confirmed")ac.appendChild(btn("Потвърди",()=>setStatus(id,v,"confirmed"),true));
if(st!=="canceled")ac.appendChild(btn("Откажи",()=>confirm("Да се откаже ли резервацията? Часът ще се освободи.")?setStatus(id,v,"canceled"):Promise.resolve()));
ac.appendChild(btn("Изтрий",()=>confirm("Да се изтрие ли резервацията завинаги?")?remove(id,v):Promise.resolve()));
c.append(t,w,bd,ac);ls.appendChild(c)})}
onAuthStateChanged(auth,u=>{
if(unsub){unsub();unsub=null}
if(!u){show(true,false,false,"");return}
if(u.email.toLowerCase()!==ADMIN_EMAIL.toLowerCase()){show(false,false,true,"Този акаунт няма достъп.");return}
show(false,true,true,"");
unsub=onSnapshot(collection(db,"barber_bookings"),sn=>{bookings={};sn.docs.forEach(d=>{bookings[d.id]=d.data()});render()},
e=>{$("astat").textContent="Няма права за четене. Провери Firestore правилата. ("+(e&&e.code||"unknown")+")";$("alist").innerHTML="";console.error(e)})});
$("f").onsubmit=async e=>{e.preventDefault();$("go").disabled=true;$("lmsg").textContent="";
try{await signInWithEmailAndPassword(auth,$("email").value.trim(),$("pw").value)}
catch(err){const c=err&&err.code||"unknown";$("lmsg").textContent=(c==="auth/invalid-credential"||c==="auth/wrong-password"||c==="auth/user-not-found"?"Грешен имейл или парола. ":"Грешка при вход. ")+"("+c+")";console.error(err)}
finally{$("go").disabled=false}};
$("out").onclick=()=>signOut(auth);
</script>
</body>
</html>
